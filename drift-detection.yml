# .github/workflows/drift-detection.yml
# Runs a scheduled `terraform plan` to detect drift from the state file.
name: Drift Detection

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual triggering

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  drift-check:
    name: Drift Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]
      fail-fast: false # Allow all environment checks to run even if one fails

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dataforge-ci-plan-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform -chdir=environments/${{ matrix.environment }} init

      - name: Terraform Plan for Drift
        id: plan
        run: terraform -chdir=environments/${{ matrix.environment }} plan -detailed-exitcode -no-color
        continue-on-error: true

      - name: Alert on Drift
        if: steps.plan.outputs.exitcode == 2
        run: |
          echo "::error title=Drift Detected in ${{ matrix.environment }}::Terraform drift detected. The state file no longer matches the deployed infrastructure."
          # In a real-world scenario, you would replace this echo with a call to your alerting system (Slack, PagerDuty, etc.)