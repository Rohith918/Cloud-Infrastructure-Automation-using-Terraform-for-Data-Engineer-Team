name: "Terraform Medallion Pipeline"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Only one run at a time — this pipeline creates a single-use state
# bucket/lock table, so two concurrent runs would collide.
concurrency:
  group: terraform-medallion
  cancel-in-progress: false

jobs:
  terraform-deploy:
    name: "Build & Deploy Infrastructure"
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"
      DYNAMODB_TABLE: "tf-state-medallion-locks"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Account ID makes the state bucket name unique per-account, since
      # S3 bucket names are global. Also exported to $GITHUB_ENV so later
      # steps (including the failure-cleanup step) can reuse it.
      - name: Resolve Account ID & Bucket Name
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "STATE_BUCKET=tf-state-medallion-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # ------------------------------------------------------------------
      # Lint / security scan. soft_fail is OFF on purpose: this is meant
      # to gate bad config, not just print warnings. Set soft_fail: true
      # if you'd rather it be advisory-only while you tune the ruleset.
      # ------------------------------------------------------------------
      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          config_file: .checkov.yaml
          output_format: cli
          soft_fail: false

      # ------------------------------------------------------------------
      # Bootstrap remote state storage. Created BEFORE any project
      # infrastructure so Terraform always has somewhere to record state.
      # ------------------------------------------------------------------
      - name: Ensure Remote State S3 & DynamoDB Exist
        run: |
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "Creating S3 remote state bucket: $STATE_BUCKET"
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
            else
              aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" \
                --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" --versioning-configuration Status=Enabled
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" --public-access-block-configuration \
              BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

          if ! aws dynamodb describe-table --table-name "$DYNAMODB_TABLE" 2>/dev/null; then
            echo "Creating DynamoDB lock table: $DYNAMODB_TABLE"
            aws dynamodb create-table \
              --table-name "$DYNAMODB_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$AWS_REGION"
            aws dynamodb wait table-exists --table-name "$DYNAMODB_TABLE" --region "$AWS_REGION"
          fi

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=medallion/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${DYNAMODB_TABLE}"

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      # ------------------------------------------------------------------
      # Rollback: runs if ANY earlier step failed or the run was
      # cancelled. Tears down project infra first (while the state
      # backend still exists), then tears down the state backend itself.
      # ------------------------------------------------------------------
      - name: Rollback & Destroy Infrastructure on Failure
        if: failure() || cancelled()
        run: |
          echo "Pipeline aborted or failed. Starting teardown..."

          # Only attempt `terraform destroy` if init actually succeeded
          # (i.e. there's a backend to talk to / state to read).
          if [ -d ".terraform" ]; then
            terraform destroy -auto-approve || true
          else
            echo "Terraform was never initialized — skipping destroy, nothing was provisioned."
          fi

          # Empty and delete the state bucket. Because versioning is
          # enabled, a plain `aws s3 rm --recursive` only removes current
          # object versions and leaves old versions + delete markers
          # behind, which blocks bucket deletion — so all versions are
          # removed explicitly first.
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "Purging and deleting state bucket: $STATE_BUCKET"
            aws s3api list-object-versions --bucket "$STATE_BUCKET" \
              --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
              --output json > versions.json 2>/dev/null || echo '{"Objects":null}' > versions.json
            if [ "$(jq '.Objects != null' versions.json)" = "true" ]; then
              aws s3api delete-objects --bucket "$STATE_BUCKET" --delete file://versions.json || true
            fi
            aws s3api list-object-versions --bucket "$STATE_BUCKET" \
              --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
              --output json > markers.json 2>/dev/null || echo '{"Objects":null}' > markers.json
            if [ "$(jq '.Objects != null' markers.json)" = "true" ]; then
              aws s3api delete-objects --bucket "$STATE_BUCKET" --delete file://markers.json || true
            fi
            aws s3api delete-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" || true
          fi

          # Delete the DynamoDB lock table.
          aws dynamodb delete-table --table-name "$DYNAMODB_TABLE" --region "$AWS_REGION" || true

          echo "Teardown complete."

      - name: Display Success Message
        if: success()
        run: |
          echo "=========================================================="
          echo " SUCCESS: Infrastructure deployed."
          echo " Medallion S3 layers, VPC, KMS, Glue, and Athena are ready."
          echo "=========================================================="
