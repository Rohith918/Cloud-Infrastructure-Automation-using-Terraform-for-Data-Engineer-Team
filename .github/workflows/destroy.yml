name: "Terraform Medallion Pipeline - Manual Destroy"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm — this tears down all provisioned infrastructure (VPC, S3 data lake, KMS key, Glue, Athena, etc). The state backend (S3 bucket + DynamoDB table) is NOT touched.'
        required: true

# Shares a concurrency group with deploy.yml so a manual destroy can never
# run at the same time as a deploy — both would fight over the same state.
concurrency:
  group: terraform-medallion
  cancel-in-progress: false

jobs:
  terraform-destroy:
    name: "Destroy Provisioned Infrastructure"
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"
      DYNAMODB_TABLE: "tf-state-medallion-locks"

    steps:
      # Manual "type to confirm" gate — this is a destructive action
      # triggered by hand, so a typo'd click shouldn't be enough to run it.
      - name: Confirm Destroy Intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Confirmation input did not match 'destroy'. Aborting — nothing was touched."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Account ID & Bucket Name
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "STATE_BUCKET=tf-state-medallion-${ACCOUNT_ID}" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      # Deliberately does NOT bootstrap/create the backend the way
      # deploy.yml does. This workflow should only ever run against a
      # backend that already exists from a prior deploy — if it's
      # missing, there is nothing valid to destroy against, and silently
      # creating a fresh empty one here would make `terraform destroy`
      # quietly no-op instead of failing loudly and telling you why.
      - name: Verify State Backend Exists
        run: |
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "State bucket $STATE_BUCKET not found."
            echo "Either nothing has been deployed yet, or it was already destroyed."
            exit 1
          fi
          if ! aws dynamodb describe-table --table-name "$DYNAMODB_TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "DynamoDB lock table $DYNAMODB_TABLE not found."
            echo "Either nothing has been deployed yet, or it was already destroyed."
            exit 1
          fi

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=medallion/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${DYNAMODB_TABLE}"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve

      # NOTE: no cleanup of $STATE_BUCKET or $DYNAMODB_TABLE here on
      # purpose — the whole point of this workflow is to tear down the
      # project resources while leaving the backend intact, so the next
      # deploy.yml run has state to init against instead of starting from
      # a missing-backend error.

      - name: Display Success Message
        if: success()
        run: |
          echo "=========================================================="
          echo " SUCCESS: Project infrastructure destroyed."
          echo " State backend ($STATE_BUCKET / $DYNAMODB_TABLE) was left"
          echo " in place — the next deploy run will reuse it, and Terraform"
          echo " will see an empty state (no drift) since everything it"
          echo " was tracking has been destroyed."
          echo "=========================================================="
