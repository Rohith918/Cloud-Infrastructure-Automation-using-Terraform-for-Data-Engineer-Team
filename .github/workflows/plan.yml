name: "Terraform Plan"

on:
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC authentication
  contents: read
  pull-requests: write # Required to post plan comments on PRs

jobs:
  plan:
    name: "Plan (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      # Run a separate plan job for each environment that has changes.
      matrix:
        environment: [dev, staging, prod]

    # This condition ensures the job only runs if files in its corresponding environment directory have changed.
    if: |
      github.event_name == 'pull_request' &&
      (
        # Check for changes in the specific environment directory
        (join(github.event.pull_request.changed_files, ' ') =~ 'environments/${{ matrix.environment }}/') ||
        # Or check for changes in shared modules
        (join(github.event.pull_request.changed_files, ' ') =~ 'modules/')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dataforge-ci-plan-role
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        id: init
        run: terraform -chdir=environments/${{ matrix.environment }} init

      - name: Terraform Plan
        id: plan
        working-directory: environments/${{ matrix.environment }}
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true

      - name: Post Plan to PR
        uses: terraform-actions/cli-comment-autoplan@v1
        with:
          path: environments/${{ matrix.environment }}
          plan_command: terraform show -no-color tfplan
          job_name: 'Plan (${{ matrix.environment }})'
          exit_code: ${{ steps.plan.outputs.exitcode }}
