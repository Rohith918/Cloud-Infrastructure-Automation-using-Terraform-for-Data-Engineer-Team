name: "Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"
      - "bootstrap/**"

permissions:
  contents: read

jobs:
  apply:
    name: "Apply (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev]

    environment: ${{ matrix.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Configure AWS Credentials via Secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Bootstrap Backend Infrastructure if Missing
        run: |
          if ! aws s3api head-bucket --bucket "dataforge-terraform-state-shared" 2>/dev/null; then
            echo "State bucket 'dataforge-terraform-state-shared' does not exist. Provisioning backend now..."
            terraform -chdir=bootstrap init
            terraform -chdir=bootstrap apply -auto-approve
          else
            echo "State bucket 'dataforge-terraform-state-shared' already exists. Skipping bootstrap."
          fi

      - name: Terraform Init
        run: terraform -chdir=environments/${{ matrix.environment }} init

      - name: Terraform Apply
        run: terraform -chdir=environments/${{ matrix.environment }} apply -auto-approve
