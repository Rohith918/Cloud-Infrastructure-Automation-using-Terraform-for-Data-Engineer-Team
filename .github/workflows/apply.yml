name: "Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"

permissions:
  id-token: write  # CRITICAL: Required for OIDC token generation
  contents: read

jobs:
  apply:
    name: "Apply (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false 
      matrix:
        environment: [dev]

    environment: ${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::680480585151:role/nr918
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform -chdir=environments/${{ matrix.environment }} init

      - name: Terraform Apply
        run: terraform -chdir=environments/${{ matrix.environment }} apply -auto-approve
