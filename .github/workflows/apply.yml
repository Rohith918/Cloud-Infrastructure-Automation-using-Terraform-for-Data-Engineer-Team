name: "Terraform Apply"

on:
  push:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"
      - "bootstrap/**"

permissions:
  contents: read

jobs:
  apply:
    name: "Apply (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev]

    environment: ${{ matrix.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Configure AWS Credentials via Secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 1. BOOTSTRAP BACKEND
      - name: Bootstrap Backend Infrastructure if Missing
        id: bootstrap
        run: |
          BUCKET_EXISTS=0
          TABLE_EXISTS=0

          if aws s3api head-bucket --bucket "dataforge-terraform-state-shared" 2>/dev/null; then
            BUCKET_EXISTS=1
          fi

          if aws dynamodb describe-table --table-name "dataforge-terraform-locks" 2>/dev/null >/dev/null; then
            TABLE_EXISTS=1
          fi

          if [ $BUCKET_EXISTS -eq 0 ] || [ $TABLE_EXISTS -eq 0 ]; then
            echo "State backend components missing (Bucket: $BUCKET_EXISTS, DynamoDB: $TABLE_EXISTS). Provisioning backend now..."
            terraform -chdir=bootstrap/state-backend init
            terraform -chdir=bootstrap/state-backend apply -auto-approve
          else
            echo "State bucket and DynamoDB lock table both exist. Skipping bootstrap."
          fi

      # Cleanup bootstrap if bootstrap itself fails halfway
      - name: Auto-Destroy Bootstrap on Failure
        if: failure() && steps.bootstrap.outcome == 'failure'
        run: |
          echo "⚠️ Bootstrap step failed! Tearing down partial backend resources..."
          terraform -chdir=bootstrap/state-backend destroy -auto-approve || true

      # 2. ENVIRONMENT INITIALIZATION & APPLY
      - name: Terraform Init
        run: terraform -chdir=environments/${{ matrix.environment }} init

      - name: Terraform Apply
        id: env_apply
        run: terraform -chdir=environments/${{ matrix.environment }} apply -auto-approve

      # 3. ENVIRONMENT AUTO-DESTROY ON FAILURE
      - name: Rollback / Auto-Destroy Environment Resources on Failure
        if: failure() && steps.env_apply.outcome == 'failure'
        run: |
          echo "⚠️ Pipeline failed during Terraform Apply! Running Terraform Destroy to roll back created resources..."
          terraform -chdir=environments/${{ matrix.environment }} destroy -auto-approve
