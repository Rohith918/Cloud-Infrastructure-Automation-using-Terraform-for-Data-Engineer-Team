name: "Terraform Apply"

on:
  push:
    branches:
      - main

permissions:
  # No special permissions needed for static key-based auth
  contents: read

jobs:
  apply:
    name: "Apply (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging, prod]

    # Use a GitHub Environment to gate deployments if needed (e.g., for manual approval).
    environment: ${{ matrix.environment }}

    # This condition ensures the job only runs if files in its corresponding environment directory have changed.
    if: |
      (
        contains(join(github.event.commits.*.modified, ' '), format('environments/{0}/', env.ENVIRONMENT)) ||
        contains(join(github.event.commits.*.modified, ' '), 'modules/')
      )
    env:
      ENVIRONMENT: ${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Aligned with other workflows

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0 # Aligned with other workflows

      - name: Terraform Init
        run: terraform -chdir=environments/${{ matrix.environment }} init

      - name: Terraform Apply
        run: terraform -chdir=environments/${{ matrix.environment }} apply -auto-approve
