name: "Apply Infrastructure Deployment"

on:
  push:
    branches:
      - main
    paths:
      - "environments/dev/**"
      - "modules/**"
      - ".github/workflows/apply.yml"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: "Terraform Apply (dev)"
    runs-on: ubuntu-latest
    environment: dev # Requires GitHub Environment setup if manual approval is configured

    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::680480585151:oidc-provider/token.actions.githubusercontent.com
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
