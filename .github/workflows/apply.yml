name: "Terraform Apply"

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply:
    name: "Apply (${{ matrix.environment }})"
    runs-on: ubuntu-latest
    strategy:
      # Set max-parallel or fail-fast depending on environment deployment rules
      fail-fast: false 
      matrix:
        environment: [dev, staging, prod]

    # Target specific GitHub Environment for variable/secret resolution & approvals
    environment: ${{ matrix.environment }}

    # FIXED: Replaced env.ENVIRONMENT with matrix.environment
    if: |
      (
        contains(join(github.event.commits.*.modified, ' '), format('environments/{0}/', matrix.environment)) ||
        contains(join(github.event.commits.*.modified, ' '), 'modules/')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Automatically resolves environment-scoped secrets if defined in GitHub
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform -chdir=environments/${{ matrix.environment }} init

      - name: Terraform Apply
        run: terraform -chdir=environments/${{ matrix.environment }} apply -auto-approve