# Pre-commit configuration for DataForge
# See https://pre-commit.com for more information

default_stages: [pre-commit]
exclude: '^(\.git|\.terraform)/'

repos:
  # 1. Standard Git Hygiene Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # 2. Secret Scanning via Gitleaks
  # Prevents hardcoded AWS keys, passwords, or tokens from being committed
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # 3. Terraform Code Quality & Formatting
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.88.0
    hooks:
      - id: terraform_fmt
        name: Terraform Format Check
      - id: terraform_validate
        name: Terraform Validate Syntax
        args:
          - --hook-config=default_override_author=true
